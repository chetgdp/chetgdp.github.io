<script>// public/parse.js
var OT_SECONDS_REG_SEASON = 300;
var PERIOD_SECONDS = 1200;
function parseI32OrZero(s) {
  return /^[+-]?[0-9]+$/.test(s) ? parseInt(s, 10) : 0;
}
function mmssToSeconds(s) {
  const parts = String(s ?? "").split(":");
  if (parts.length !== 2)
    return 0;
  return parseI32OrZero(parts[0]) * 60 + parseI32OrZero(parts[1]);
}
function secondsToMmss(total) {
  const t = Math.max(0, Math.round(total));
  const m = Math.floor(t / 60);
  const s = t % 60;
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}
function periodLength(type, gameType) {
  if (type === "SO")
    return 0;
  if (type === "OT" && gameType !== 3)
    return OT_SECONDS_REG_SEASON;
  return PERIOD_SECONDS;
}
function buildPeriods(plays, gameType) {
  const byNumber = new Map;
  for (const p of plays) {
    const pd = p.periodDescriptor;
    if (pd && !byNumber.has(pd.number)) {
      byNumber.set(pd.number, pd.periodType || "REG");
    }
  }
  const numbers = [...byNumber.keys()].sort((a, b) => a - b);
  const periods = [];
  let start = 0;
  for (const number of numbers) {
    const type = byNumber.get(number);
    const length = periodLength(type, gameType);
    periods.push({ number, type, start, length });
    start += length;
  }
  return periods;
}
function hasCoords(play) {
  const d = play.details;
  if (d == null)
    return false;
  return !(d.xCoord == null && d.yCoord == null && ![505, 502, 503].includes(play.typeCode));
}
function parseGame(pbp) {
  if (!pbp || !Array.isArray(pbp.plays)) {
    throw new Error("play-by-play JSON has no plays array");
  }
  const periods = buildPeriods(pbp.plays, pbp.gameType);
  const startOf = new Map(periods.map((p) => [p.number, p]));
  const plays = pbp.plays.filter((p) => p.periodDescriptor).map((p) => {
    const period = startOf.get(p.periodDescriptor.number);
    const inPeriod = Math.min(mmssToSeconds(p.timeInPeriod), period.length || 0);
    const d = p.details || {};
    return {
      eventId: p.eventId,
      sortOrder: p.sortOrder ?? 0,
      typeCode: p.typeCode,
      type: p.typeDescKey,
      period: p.periodDescriptor.number,
      periodType: period.type,
      inPeriod,
      gameSeconds: period.start + inPeriod,
      x: d.xCoord ?? 0,
      y: d.yCoord ?? 0,
      playerId: d.shootingPlayerId ?? d.scoringPlayerId ?? d.hittingPlayerId ?? d.blockingPlayerId ?? d.playerId ?? 0,
      teamId: d.eventOwnerTeamId ?? 0,
      details: d,
      drawable: hasCoords(p),
      homeDefending: p.homeTeamDefendingSide ?? null
    };
  });
  plays.sort((a, b) => a.gameSeconds - b.gameSeconds || a.sortOrder - b.sortOrder);
  const roster = new Map((pbp.rosterSpots || []).map((r) => [r.playerId, {
    teamId: r.teamId,
    name: `${r.firstName?.default ?? ""} ${r.lastName?.default ?? ""}`.trim(),
    lastName: r.lastName?.default ?? "",
    number: r.sweaterNumber,
    position: r.positionCode
  }]));
  const last = periods[periods.length - 1];
  return {
    id: pbp.id,
    gameType: pbp.gameType,
    gameState: pbp.gameState,
    away: pbp.awayTeam,
    home: pbp.homeTeam,
    periods,
    duration: last ? last.start + last.length : 0,
    plays,
    events: plays.filter((p) => p.drawable),
    roster
  };
}
function parseShifts(json, game) {
  const startOf = new Map(game.periods.map((p) => [p.number, p.start]));
  const rows = Array.isArray(json?.data) ? json.data : [];
  const shifts = [];
  for (const r of rows) {
    if (r.typeCode !== 517 || !startOf.has(r.period))
      continue;
    const base = startOf.get(r.period);
    shifts.push({
      teamId: r.teamId,
      playerId: r.playerId,
      name: `${r.firstName ?? ""} ${r.lastName ?? ""}`.trim(),
      start: base + mmssToSeconds(r.startTime),
      end: base + mmssToSeconds(r.endTime)
    });
  }
  return shifts;
}

// public/scene.js
var CAMERA_HOME = [0, -75, 75];
var w = window.innerWidth;
var h = window.innerHeight;
var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.autoClear = false;
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(w, h);
renderer.physicallyCorrectLights = true;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1;
document.body.appendChild(renderer.domElement);
renderer.domElement.style.zIndex = "1";
var camera = new THREE.PerspectiveCamera(75, w / h, 1, 4000);
camera.position.set(...CAMERA_HOME);
camera.lookAt(0, 0, 0);
camera.up.set(0, 0, 1);
var scene = new THREE.Scene;
scene.background = new THREE.Color(8882055);
var controls = new THREE.TrackballControls(camera, renderer.domElement);
controls.minDistance = 5;
controls.maxDistance = 3000;
controls.staticMoving = false;
controls.zoomSpeed = 1.2;
controls.rotateSpeed = 1;
controls.panSpeed = 0.8;
function resetCamera() {
  camera.position.set(...CAMERA_HOME);
  camera.lookAt(0, 0, 0);
  camera.up.set(0, 0, 1);
  controls.update();
}
function renderTools() {
  const gridHelper = new THREE.GridHelper(1000, 40);
  gridHelper.rotation.x = Math.PI / 2;
  scene.add(gridHelper);
  scene.add(new THREE.AxesHelper(500));
}
var frameHooks = [];
function onFrame(fn) {
  frameHooks.push(fn);
}
function animate(now) {
  requestAnimationFrame(animate);
  for (const fn of frameHooks)
    fn(now);
  controls.update();
  renderer.render(scene, camera);
}
window.addEventListener("resize", () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  controls.update();
  renderer.setSize(w, h);
});
renderTools();
requestAnimationFrame(animate);

// public/rink.js
function renderRink() {
  installLampShaderPatch();
  const before = new Set(scene.children);
  renderIce();
  renderBoards();
  renderGlass();
  renderBenches();
  renderLines();
  renderNets();
  mergeStatic(scene.children.filter((o) => !before.has(o)));
  renderLights();
  renderGoalLights();
}
function renderGoalLights() {
  const dark = new THREE.MeshStandardMaterial({ color: 1710618, roughness: 0.7 });
  const dome = new THREE.SphereGeometry(0.35, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2);
  for (const dir of [-1, 1]) {
    const g = new THREE.Group;
    g.position.set(dir * 96, 0, 9);
    g.add(new THREE.Mesh(new THREE.BoxGeometry(0.6, 2.2, 0.5), dark));
    for (const [y, color] of [[-0.75, 13635600], [0, 1089584], [0.75, 13635600]]) {
      const d = new THREE.Mesh(dome, new THREE.MeshStandardMaterial({
        color,
        roughness: 0.3,
        transparent: true,
        opacity: 0.85
      }));
      d.rotation.x = Math.PI / 2;
      d.position.set(0, y, 0.25);
      g.add(d);
    }
    scene.add(g);
  }
}
function renderIce() {
  const geometry = new THREE.ShapeGeometry(roundedRect(RINK_W / 2, RINK_H / 2, CORNER_R));
  const base = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({
    color: 16251388,
    metalness: 0,
    roughness: 0.6,
    envMap: arenaEnvironment(),
    envMapIntensity: 0.9
  }));
  base.renderOrder = -2;
  scene.add(base);
  const coat = new THREE.MeshPhysicalMaterial({
    color: 15923452,
    roughness: 0.05,
    transmission: 0.9,
    thickness: 0.1,
    side: THREE.DoubleSide,
    transparent: true,
    depthWrite: false
  });
  const sheet = new THREE.Mesh(geometry, coat);
  sheet.position.z = 0.08;
  sheet.renderOrder = 5;
  scene.add(sheet);
}
function arenaEnvironment() {
  const env = new THREE.Scene;
  env.background = new THREE.Color(14212579);
  const stands = new THREE.Mesh(new THREE.CylinderGeometry(150, 150, 60, 48, 1, true), new THREE.MeshBasicMaterial({ color: 3422271, side: THREE.DoubleSide }));
  stands.rotation.x = Math.PI / 2;
  stands.position.z = 20;
  env.add(stands);
  const pmrem = new THREE.PMREMGenerator(renderer);
  const target = pmrem.fromScene(env, 0.01);
  pmrem.dispose();
  return target.texture;
}
var LOGO_FIT_R = 14;
var LOGO_TEX = 1024;
var centerLogo = null;
var logoToken = 0;
function renderCenterLogo(url) {
  const token = ++logoToken;
  if (centerLogo) {
    scene.remove(centerLogo);
    centerLogo.geometry.dispose();
    centerLogo.material.map.dispose();
    centerLogo.material.dispose();
    centerLogo = null;
  }
  if (!url)
    return;
  const img = new Image;
  img.crossOrigin = "anonymous";
  img.onload = () => {
    if (token !== logoToken)
      return;
    const w = img.naturalWidth || 1, h = img.naturalHeight || 1;
    const s = LOGO_TEX / Math.max(w, h);
    const dw = w * s, dh = h * s;
    const planeFt = 2 * LOGO_FIT_R;
    const canvas = document.createElement("canvas");
    canvas.width = canvas.height = LOGO_TEX;
    const ctx = canvas.getContext("2d");
    ctx.filter = "saturate(0.7)";
    ctx.drawImage(img, (LOGO_TEX - dw) / 2, (LOGO_TEX - dh) / 2, dw, dh);
    const map = new THREE.CanvasTexture(canvas);
    map.encoding = THREE.sRGBEncoding;
    map.anisotropy = 8;
    const material = new THREE.MeshBasicMaterial({
      map,
      transparent: true,
      opacity: 0.42,
      depthWrite: false,
      polygonOffset: true,
      polygonOffsetFactor: -1,
      polygonOffsetUnits: -1
    });
    centerLogo = new THREE.Mesh(new THREE.PlaneGeometry(planeFt, planeFt), material);
    centerLogo.position.set(0, 0, 0.02);
    centerLogo.renderOrder = -1;
    scene.add(centerLogo);
  };
  img.src = url;
}
var RINK_W = 200;
var RINK_H = 85;
var CORNER_R = 28;
var BOARD_T = 0.3;
var BOARD_H = 3.5;
var KICK_H = 10 / 12;
function roundedRect(hw, hh, r) {
  const s = new THREE.Shape;
  s.moveTo(-hw + r, -hh);
  s.lineTo(hw - r, -hh);
  s.absarc(hw - r, -hh + r, r, -Math.PI / 2, 0, false);
  s.lineTo(hw, hh - r);
  s.absarc(hw - r, hh - r, r, 0, Math.PI / 2, false);
  s.lineTo(-hw + r, hh);
  s.absarc(-hw + r, hh - r, r, Math.PI / 2, Math.PI, false);
  s.lineTo(-hw, -hh + r);
  s.absarc(-hw + r, -hh + r, r, Math.PI, Math.PI * 1.5, false);
  return s;
}
function boardRing(z, height, color, t = BOARD_T) {
  const outer = roundedRect(RINK_W / 2 + t, RINK_H / 2 + t, CORNER_R + t);
  outer.holes.push(roundedRect(RINK_W / 2, RINK_H / 2, CORNER_R));
  const geometry = new THREE.ExtrudeGeometry(outer, {
    depth: height,
    bevelEnabled: false,
    curveSegments: 24
  });
  const mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color, roughness: 0.6 }));
  mesh.position.z = z;
  scene.add(mesh);
}
function renderBoards() {

      .game-card .type.t3 { background: #6b1f2a; }
      #main-page .type-filter button.active { background: #4a5263; border-color: #8a93a5; }
      #game-list[data-filter="1"] .game-card:not([data-type="1"]),
      #game-list[data-filter="2"] .game-card:not([data-type="2"]),
      #game-list[data-filter="3"] .game-card:not([data-type="3"]),
      #game-list[data-filter="4"] .game-card:not([data-type="4"]) { display: none; }
      .game-card .type.t4 { background: #1f4a6b; }
      .game-card .time, .game-card .venue { font-size: 13px; color: #9aa3b5;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .game-card .time { text-align: left; font-variant-numeric: tabular-nums;
        padding-left: 16px; }
      #back-to-list { position: fixed; top: 20px; left: 20px; z-index: 1100;
        font: 15px 'Atkinson Hyperlegible Next', sans-serif; }
      #visualizer-status { position: fixed; top: 50%; left: 50%;
        transform: translate(-50%, -50%); z-index: 1100; padding: 14px 20px;
        background: rgba(20, 20, 20, 0.9); color: #eee; border-radius: 8px;
        font: 16px 'Atkinson Hyperlegible Next', sans-serif; }
    `;
  document.head.appendChild(style);
  const page = document.createElement("div");
  page.id = "main-page";
  page.innerHTML = `
      <header>
        <h1>HOKEJ</h1>
        <button id="prev-day" title="Previous day">&#9664;</button>
        <span class="day-label" id="day-label"></span>
        <button id="next-day" title="Next day">&#9654;</button>
        <input type="date" id="day-input" min="2009-10-01" title="Jump to date">
        <button id="today">Today</button>
        <span class="type-filter">
          <button data-filter="" class="active">All</button>
          <button data-filter="1">Preseason</button>
          <button data-filter="2">Regular</button>
          <button data-filter="3">Playoffs</button>
          <button data-filter="4">All-Star</button>
        </span>
      </header>
      <div id="game-list"></div>`;
  document.body.appendChild(page);
  const back = document.createElement("button");
  back.id = "back-to-list";
  back.textContent = "← Games";
  const vizStatus = document.createElement("div");
  vizStatus.id = "visualizer-status";
  document.body.append(back, vizStatus);
  const list = page.querySelector("#game-list");
  const dayLabel = page.querySelector("#day-label");
  const dayInput = page.querySelector("#day-input");
  const TYPE_LABELS = { 1: "PRE", 2: "REG", 3: "PO", 4: "ASG" };
  page.querySelectorAll(".type-filter button").forEach((b) => {
    b.addEventListener("click", () => {
      page.querySelectorAll(".type-filter button").forEach((x) => x.classList.toggle("active", x === b));
      if (b.dataset.filter)
        list.dataset.filter = b.dataset.filter;
      else
        delete list.dataset.filter;
    });
  });
  let shownDate = null;
  let requestSeq = 0;
  function localToday() {
    const now = new Date;
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    return now.toISOString().slice(0, 10);
  }
  function shiftDate(date, days) {
    const d = new Date(date + "T12:00:00Z");
    d.setUTCDate(d.getUTCDate() + days);
    return d.toISOString().slice(0, 10);
  }
  async function fetchJSON(path) {
    let r;
    try {
      r = await fetch(RELAY_BASE + path, { headers: { "X-Histos-App": "hokej" } });
    } catch (e) {
      throw new Error("Relay unreachable at " + RELAY_BASE);
    }
    if (!r.ok)
      throw new Error(`Relay returned HTTP ${r.status}`);
    return r.json();
  }
  function message(text) {
    const m = document.createElement("div");
    m.className = "message";
    m.textContent = text;
    list.replaceChildren(m);
  }
  function teamCell(team, side) {
    const cell = document.createElement("div");
    cell.className = "team " + side;
    const abbrev = document.createElement("span");
    abbrev.className = "abbrev";
    abbrev.textContent = team.abbrev;
    const parts = [abbrev];
    if (team.darkLogo) {
      const img = document.createElement("img");
      img.src = logoUrl(team.darkLogo);
      img.alt = "";
      side === "away" ? parts.unshift(img) : parts.push(img);
    }
    cell.append(...parts);
    return cell;
  }
  function stateText(g) {
    const pd = g.periodDescriptor || {};
    switch (g.gameState) {
      case "LIVE":
      case "CRIT":
        return {
          text: "LIVE" + (pd.number ? " P" + pd.number : ""),
          cls: "live",
          loadable: true
        };
      case "OFF":
      case "FINAL": {
        const extra = pd.periodType && pd.periodType !== "REG" ? "/" + pd.periodType : "";
        return { text: "Final" + extra, cls: "", loadable: true };
      }
      default: {
        const text = g.gameScheduleState === "PPD" ? "Postponed" : "Scheduled";
        return { text, cls: "", loadable: false };
      }
    }
  }
  function gameCard(g) {
    const st = stateText(g);
    const card = document.createElement(st.loadable ? "button" : "div");
    card.className = "game-card" + (st.loadable ? "" : " unavailable");
    card.dataset.gameId = String(g.id);
    card.dataset.type = String(g.gameType);
    const score = document.createElement("div");
    score.className = "score";
    score.textContent = st.loadable ? `${g.awayTeam.score ?? 0} - ${g.homeTeam.score ?? 0}` : "@";
    const state = document.createElement("div");
    state.className = "state " + st.cls;
    if (TYPE_LABELS[g.gameType]) {
      const type = document.createElement("span");
      type.className = "type t" + g.gameType;
      type.textContent = TYPE_LABELS[g.gameType];
      state.append(type);
    }
    state.append(st.text);
    const time = document.createElement("div");
    time.className = "time";
    time.textContent = g.startTimeUTC ? new Date(g.startTimeUTC).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";
    const venue = document.createElement("div");
    venue.className = "venue";
    venue.textContent = g.venue?.default ?? "";
    venue.title = venue.textContent;
    card.append(teamCell(g.awayTeam, "away"), score, teamCell(g.homeTeam, "home"), time, venue, state);
    if (st.loadable) {
      card.title = `Open ${g.awayTeam.abbrev} @ ${g.homeTeam.abbrev}`;
      card.addEventListener("click", () => {
        location.hash = "game=" + g.id;
      });
    } else {
      card.title = "Not started; nothing to show yet";
    }
    return card;
  }
  async function showList(date) {
    page.hidden = false;
    pause();
    back.hidden = true;
    vizStatus.hidden = true;
    if (date < FIRST_DAY)
      date = FIRST_DAY;
    if (lastDay && date > lastDay)
      date = lastDay;
    if (date === shownDate && list.querySelector(".game-card"))
      return;
    shownDate = date;
    dayInput.value = date;
    if (lastDay)
      dayInput.max = lastDay;
    page.querySelector("#prev-day").disabled = date <= FIRST_DAY;
    page.querySelector("#next-day").disabled = !!lastDay && date >= lastDay;
    dayLabel.textContent = new Date(date + "T12:00:00Z").toLocaleDateString([], {
      weekday: "short",
      month: "short",
      day: "numeric",
      year: "numeric",
      timeZone: "UTC"
    });
    const seq = ++requestSeq;
    message("Loading games...");
    try {
      const s = await fetchJSON(`/v1/schedule/${date}`);
      if (seq !== requestSeq)
        return;
      const day = (s.gameWeek || []).find((d) => d.date === date);
      const games = day ? day.games : [];
      if (!games.length) {
        message("No games on this day.");
        return;
      }
      list.replaceChildren(...games.map(gameCard));
    } catch (e) {
      if (seq !== requestSeq)
        return;
      shownDate = null;
      message("Could not load games: " + e.message);
    }
  }
  async function showGame(id) {
    page.hidden = true;
    back.hidden = false;
    vizStatus.hidden = false;
    vizStatus.textContent = `Loading game ${id}...`;
    const seq = ++requestSeq;
    try {
      const [pbp, shifts] = await Promise.all([
        fetchJSON(`/v1/gamecenter/${id}/play-by-play`),
        fetchJSON(`/v1/shiftcharts/${id}`).then((json) => ({ json }), (e) => ({ error: e.message }))
      ]);
      if (seq !== requestSeq)
        return;
      loadGame(pbp, shifts.json ?? null, shifts.error ?? "");
      document.title = `${pbp.awayTeam.abbrev} @ ${pbp.homeTeam.abbrev} - hokej`;
      vizStatus.hidden = true;
      if (pbp.gameDate)
        shownDateForBack = pbp.gameDate;
    } catch (e) {
      if (seq !== requestSeq)
        return;
      vizStatus.textContent = `Could not load game ${id}: ${e.message}`;
    }
  }
  let shownDateForBack = null;
  let lastDay = null;
  function route() {
    const params = new URLSearchParams(location.hash.slice(1));
    const game = params.get("game");
    const date = params.get("date");
    if (game && GAME_ID_RE.test(game)) {
      showGame(game);
      return;
    }
    document.title = "hokej";
    showList(date && DATE_RE.test(date) ? date : shownDateForBack || shownDate || shiftDate(localToday(), -1));
  }
  function goToDate(date) {
    location.hash = "date=" + date;
  }
  page.querySelector("#prev-day").addEventListener("click", () => goToDate(shiftDate(shownDate || localToday(), -1)));
  page.querySelector("#next-day").addEventListener("click", () => goToDate(shiftDate(shownDate || localToday(), 1)));
  page.querySelector("#today").addEventListener("click", () => goToDate(localToday()));
  dayInput.addEventListener("change", () => {
    if (DATE_RE.test(dayInput.value))
      goToDate(dayInput.value);
  });
  back.addEventListener("click", () => {
    const date = shownDateForBack || shownDate;
    if (date)
      goToDate(date);
    else
      location.hash = "";
  });
  window.addEventListener("hashchange", route);
  fetchJSON(`/v1/schedule/${localToday()}`).then((s) => {
    lastDay = s.playoffEndDate || null;
  }, () => {}).finally(route);
})();
</script>


</body></html>
