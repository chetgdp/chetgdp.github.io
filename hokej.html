// public/scene.js
var CAMERA_HOME = [0, -75, 75];

}

    const g = new THREE.Group;
    g.position.set(dir * 96, 0, 9);
    g.add(new THREE.Mesh(new THREE.BoxGeometry(0.6, 2.2, 0.5), dark));
    for (const [y, color] of [[-0.75, 13635600], [0, 1089584], [0.75, 13635600]]) {

        color,
        roughness: 0.3,
        transparent: true,
        opacity: 0.85

function teamOf(id) {
  return teams.find((t) => t.id === id);
}
function buildPenalties() {
  const goals = game.plays.filter((p) => p.typeCode === 505 && p.periodType !== "SO");
  return game.plays.filter((p) => p.typeCode === 509 && p.details.duration).map((p) => {
    const d = p.details;
    const teamId = game.roster.get(d.committedByPlayerId)?.teamId ?? p.teamId;
    const start = p.gameSeconds;
    let end = Math.min(start + d.duration * 60, game.duration);
    if (d.typeCode === "MIN") {
      const g = goals.find((g) => g.teamId !== teamId && g.gameSeconds > start && g.gameSeconds < end);
      if (g)
        end = g.gameSeconds;
    }
    const playerId = d.committedByPlayerId ?? d.servedByPlayerId;
    return {
      start,
      end,
      teamId,
      playerId,
      desc: d.descKey ?? "penalty",
      minutes: d.duration
    };
  });
}
function boxedAt(t) {
  return penalties.filter((p) => p.start <= t && t < p.end).sort((a, b) => a.end - b.end).map((p) => ({
    teamId: p.teamId,
    playerId: p.playerId,
    clock: secondsToMmss(p.end - t),
    detail: `${p.desc.replace(/-/g, " ")} (${p.minutes})`
  }));
}
function timelineMarkers() {
  return game.plays.filter((p) => TIMELINE_TYPES.has(p.type)).map((p) => {
    const team = teamOf(p.teamId);
    const major = p.type === "goal" || p.type === "penalty";
    return {
      t: p.gameSeconds,
      type: p.type,
      major,
      color: team?.color ?? "#666",
      title: `${timeLabel(p.gameSeconds)} ${team?.abbrev ?? ""} ` + typeLabel(p)
    };
  });
}

  time2 = t;

    box: b.teamId === game.home.id ? 0 : 1,
    color: teamOf(b.teamId)?.color ?? "#888",
    number: game.roster.get(b.playerId)?.number
  })));
}
function loadGame(pbp, shiftJson, shiftError) {
  game = parseGame(pbp);
  const colors = gameColors(game.away.id, game.home.id);
  teams = [game.away, game.home].map((t) => ({
    id: t.id,
    abbrev: t.abbrev,
    color: "#" + colors.get(t.id).toString(16).padStart(6, "0"),
    logo: logoUrl(t.darkLogo)
  }));
  renderCenterLogo(logoUrl(game.home.logo));
  setBenchColors(teams[1].color, teams[0].color);
  penalties = buildPenalties();
  pinnedPlay = null;
  rinkTip.style.display = "none";
  loadEvents(game, colors);
  setScoreboard(teams);
  initFilters(game.events, teams, refreshEvents);
  const shifts = shiftJson ? parseShifts(shiftJson, game) : [];
  const message = shiftError ? `Shift data unavailable: ${shiftError}` : shifts.length ? "" : "No shift data for this game.";
  initShifts(shifts, teams, game.roster, game.duration, message);
  initTimeline(game.duration, onTime);
  setMarkers(timelineMarkers(), game.periods);
}
